aid: scylladb
name: ScyllaDB
description: >-
  ScyllaDB is a high-performance distributed NoSQL database engineered for
  real-time, data-intensive applications, offering close-to-the-metal
  architecture with predictable single-digit millisecond latencies and millions
  of operations per second. It is fully compatible with Apache Cassandra's CQL
  interface and Amazon DynamoDB's API (via Project Alternator), enabling
  drop-in migration from either platform. ScyllaDB Cloud is a fully managed
  database-as-a-service available on AWS and GCP, providing a REST management
  API for automating cluster provisioning, scaling, networking, and
  configuration. The platform supports vector search, multi-region active-active
  replication, and a Kubernetes operator for self-managed deployments.
