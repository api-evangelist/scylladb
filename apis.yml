  - aid: scylladb:admin-rest-api
    name: ScyllaDB Admin REST API
    description: >-
      Node-level administrative REST API exposing endpoints to check and update
      configuration, retrieve cluster-level and node-level information, and
      execute administrative operations. Exposed locally on port 10000 with
      a Swagger 2.0 definition available at /v2 and an interactive Swagger UI
      at /ui.
    humanURL: https://docs.scylladb.com/stable/operating-scylla/rest.html
