apis:
  - aid: scylladb:cloud-management-api
    name: ScyllaDB Cloud Management API
    description: >-
      REST API for programmatic access to ScyllaDB Cloud, enabling automation
      of cluster provisioning, resizing, deletion, VPC peering, firewall rules,
      datacenter management, vector search nodes, and account configuration.
      Authenticated via personal access tokens.
    humanURL: https://cloud.docs.scylladb.com/stable/api-docs/
    baseURL: https://api.cloud.scylladb.com
    tags:
      - Cloud Management
      - Cluster Operations
      - Database
      - NoSQL
