serviceCategory: Database
billingModel:
  pricingCategory: Resource-Based
  billingFrequency: Monthly
  billingCurrency: USD
focusColumns:
  ServiceName: ScyllaDB Cloud
  ServiceCategory: Database
  ProviderName: ScyllaDB
  PublisherName: ScyllaDB
