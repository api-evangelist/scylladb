meters:
  - name: Compute
    unit: vCPU-hour
    aggregation: sum
  - name: Memory
    unit: GB-hour
    aggregation: sum
  - name: Storage
    unit: GB-month
    aggregation: sum
  - name: Network Egress
    unit: GB
    aggregation: sum
  - name: Vector Search Node
    unit: node-hour
    aggregation: sum
principles:
  - name: Visibility
    description: >-
      Track ScyllaDB Cloud consumption monthly by cluster, datacenter, and
      instance type to understand cost drivers across compute, memory, and
      storage dimensions.
  - name: Optimization
    description: >-
      Right-size cluster resources (vCPU, RAM, storage) to actual workload
      needs; migrate from on-demand to fixed contracts or Flex Credits for
      predictable workloads to achieve up to 70% cost savings.
  - name: Accountability
    description: >-
      Tag clusters by team, application, and environment; use ScyllaDB Cloud
      account billing reports to allocate database costs to business units and
      product teams.
