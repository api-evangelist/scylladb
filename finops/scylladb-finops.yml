description: >-
  FOCUS-aligned FinOps profile for ScyllaDB Cloud. Billing is resource-based
  (vCPU, RAM, NVMe SSD storage) with three service tiers (Standard,
  Professional, Premium) and three billing options (On-Demand, Fixed Contract,
  Flex Credits). No per-request charges apply; cost optimization focuses on
  right-sizing cluster resources, selecting appropriate instance types, and
  choosing contract vs. on-demand billing based on workload predictability.
  Contracts offer up to 70% savings over on-demand pricing.
sources:
  - https://www.scylladb.com/pricing/
  - https://cloud.docs.scylladb.com/stable/cloud-services/billing.html
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
