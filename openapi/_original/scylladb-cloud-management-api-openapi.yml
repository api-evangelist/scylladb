servers:
- url: /
security:
- Authorization: []
paths:
  /deployment/cloud-providers:
    get:
      operationId: getCloudProviders
      summary: Get list of supported cloud providers
      description: Lists details about all cloud provider currently supported in Scylla-Cloud.
      x-public: true
      tags:
      - Deployment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '040101'
                  data:
                    properties:
                      cloudProviders:
                        type: array
                        items:
                          $ref: '#/components/schemas/cloudProvider'
                    required:
                    - cloudProviders
  /pricing:
    post:
      operationId: searchPricing
      summary: Search pricing
      description: Searches for pricing items based on infrastructure, product, and
        commercial filters
      x-public: true
      tags:
      - Pricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - infrastructure
              properties:
                infrastructure:
                  type: object
                  required:
                  - provider
                  properties:
                    provider:
                      type: string
                      example: AWS
                    region:
                      type: string
                      description: Resolves region by code (e.g. "us-east-1") or display
                        name (e.g. "Virginia")
                      example: us-east-1
                    deployment:
                      type: string
                      enum:
                      - Cloud
                      - BYOA
                    instanceFamily:
                      type: string
                      example: i4i
                    instanceType:
                      type: string
                      example: i4i.large
                product:
                  type: object
                  properties:
                    productTypes:
                      type: array
                      items:
                        type: string
                        enum:
                        - STANDARD_CLOUD
                        - XCLOUD
                        - VECTOR_SEARCH
                commercial:
                  type: object
                  properties:
                    contractType:
                      type: string
                      enum:
                      - ON_DEMAND
                      - SUBSCRIPTION
                      - FLEX_CREDIT
                    contractTerm:
                      type: string
                      enum:
                      - 1_YEAR
                      - 3_YEARS
                      - ANY
                    paymentOption:
                      type: string
                      enum:
                      - UPFRONT
                      - MONTHLY
