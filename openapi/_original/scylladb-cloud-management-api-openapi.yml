      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/errorObject'
                - type: object
                  properties:
                    data:
                      properties:
                        regions:
                          type: array
                          items:
                            $ref: '#/components/schemas/region'
                        defaultRegionId:
                          type: integer
                          example: 30
                        defaultInstanceId:
                          type: integer
                          example: 40
                        instances:
                          type: array
                          items:
                            $ref: '#/components/schemas/instance'
                      required:
                      - regions
  /deployment/cloud-provider/{cloudProviderId}/region/{regionId}:
    get:
      operationId: getCloudProviderRegion
      summary: Get all instances for the selected region
      description: Lists instances supported in given region of given cloud provider.
      x-public: true
      tags:
      - Deployment
      parameters:
      - in: path
        description: Cloud Provider ID (full list [get] /deployment/provider)
        name: cloudProviderId
        required: true
        schema:
          type: integer
          example: 1
      - in: path
        description: Cloud Region ID (full list [get] /deployment/provider/{}/region)
        name: regionId
        required: true
        schema:
          type: integer
          example: 30
      - in: query
        description: Should include default values
        name: defaults
        required: false
        schema:
          type: boolean
          default: false
      - description: target for the requested instance types
        in: query
        name: target
        schema:
          type: string
          enum:
          - VECTOR_SEARCH
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '040101'
                  data:
                    properties:
                      defaultInstanceId:
                        type: integer
                        example: 1
                      instances:
                        type: array
                        items:
                          $ref: '#/components/schemas/instance'
                    required:
                    - instances
components:
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      description: 'Authorization header, required in all authenticated requests.


        Header format: **Authorization: Bearer <token>**

        '
  schemas:
    ClusterConnection:
      type: object
      description: Peering details information
      x-public: true
      properties:
        awaitingData:
          allOf:
          - type: object
          - $ref: '#/components/schemas/ClusterConnectionAwaitingData'
          description: AwaitingData represents information regarding the action that
            needs to be done to move connection creating process further
        awaitingForClient:
          type: boolean
          description: AwaitingForClient if true, then going to next stage require
            user action
        cidrlist:
          type: array
          description: CIDR list of the routes cluster have access through this connection
          items:
            $ref: '#/components/schemas/CIDR'
        clusterDCID:
          type: integer
          description: ID of the cluster DC
        clusterID:
          type: integer
          description: ID of the cluster
        clusterVPCID:
          type: integer
          description: ID of the VPC
        data:
          type: object
          additionalProperties:
            type: string
        externalID:
          type: string
          description: ExternalID and ID of the connection object on the cloud
        id:
          type: integer
          description: ID of the created connection (ScyllaDB internal)
        name:
          type: string
          description: Name if the connection, only to show on UI
        stage:
          type: string
          description: Stage if there is ongoing process it shows where this process
            exactly at
        stageMessage:
          type: string
          description: StageMessage is a message from stage processor why it can't
            move further
        status:
          type: string
          enum:
          - INIT
          - PENDING
          - ACTIVE
          - INACTIVE
          - DELETING
          - DELETED
          - FAILED
        type:
          type: string
          enum:
          - AWS_TGW_ATTACHMENT
    ClusterInfo:
      type: object
      description: Information about the cluster
      x-public: true
      properties:
        id:
          type: integer
          description: ID of the cluster
        accountId:
          type: integer
          description: ID of the account where cluster belongs to
        clusterName:
          type: string
          description: Name of the cluster
        scalingMode:
          type: object
          description: Scaling mode of the cluster.
          properties:
            mode:
              $ref: '#/components/schemas/ScalingMode'
        status:
          type: string
          description: Status of the cluster
          enum:
          - ACTIVE
          - QUEUED
          - BOOTSTRAPPING
          - BOOTSTRAP_ERROR
          - INACTIVE
          - PENDING_DELETE
          - DELETED
        cloudProviderId:
          type: integer
          description: ID of the cloud provider (full list [get] /deployment/cloud-providers)
        encryptionAtRest:
          $ref: '#/components/schemas/EncryptionAtRest'
          description: 'Encryption at rest info for this cluster

            Specifies the key id and provider

            Empty if the cluster does not use the encryption-at-rest feature'
        encryptionMode:
          description: Defines how the client can connect to the cluster using CQL.
          type: string
        encryptionCertificateMode:
          description: EncryptionCertificateMode when client connection is encrypted
            this property indicates if Cluster CA was signed with Account CA
          type: string
        userApiInterface:
          type: string
          description: CQL or ALTERNATOR (DynamoDB)
          enum:
          - CQL
          - ALTERNATOR
        deals:
          type: array
          description: deals in use of the cluster
          items:
            $ref: '#/components/schemas/DealsInUse'
        isLocked:
          type: boolean
          description: Indicates whether the cluster is currently locked due to an
            ongoing operation
        pricingModel:
          type: integer
          description: Defines the pricing model
        maxAllowedCIDRRange:
          type: integer
          description: Max CIDR range the user is allowed to specify on allowed ips
            rules, 0 disable all limitations.
        dns:
          type: boolean
          description: DNS enabled flag
        dcCount:
          type: integer
          description: Number of Data Centers
        dc:
          $ref: '#/components/schemas/ClusterDCInfo'
        provisioning:
          $ref: '#/components/schemas/ProvisionType'
        alternatorWriteIsolation:
          type: string
          description: Write isolation for ALTERNATOR
          enum:
          - ''
          - forbid
          - only_rmw_uses_lwt
          - always
        expiresAt:
          type: string
        progress:
          $ref: '#/components/schemas/ClusterRequestProgress'
        accountCloudProviderCredentialsId:
          type: integer
          description: ID of the account credentials
        requestError:
          type: string
          description: Descriptive information about the potential error
        scyllaVersion:
          $ref: '#/components/schemas/scyllaVersion'
      required:
      - id
      - accountId
      - clusterName
      - status
      - cloudProviderId
      - scyllaVersion
    ClusterEnriched:
      x-public: true
      allOf:
      - $ref: '#/components/schemas/ClusterInfo'
      - type: object
        properties:
          scyllaVersion:
            $ref: '#/components/schemas/scyllaVersion'
          cloudProvider:
            $ref: '#/components/schemas/cloudProvider'
          regionId:
            type: integer
            description: ID of the cloud provider region (full list [get] /deployment/cloud-provider/{}/regions)
          region:
            $ref: '#/components/schemas/region'
          instanceId:
            type: integer
            description: ID of the instance type
          instance:
            $ref: '#/components/schemas/instance'
    ClusterWithMetrics:
      x-public: true
      allOf:
      - $ref: '#/components/schemas/ClusterInfo'
      - type: object
        properties:
          instanceId:
            type: integer
            description: ID of the instance type
          metrics:
            type: object
            additionalProperties:
              type: number
              description: Map of cluster metrics [metric_name | value]
    ClusterDetailedInfo:
      x-public: true
      allOf:
      - $ref: '#/components/schemas/ClusterEnriched'
      - type: object
        properties:
          replicationFactor:
            type: integer
            description: Replication Factor (RF)
          broadcastType:
            type: string
            description: Broadcast type
            enum:
            - PRIVATE
            - PUBLIC
          grafanaUrl:
            type: string
            description: URL of grafana (part of Monitoring Stack)
          createdAt:
            type: string
            description: Creation date
            format: date-time
          promProxyEnabled:
            type: boolean
            description: Prometheus proxy enabled flag
          rebootEnabled:
            type: boolean
            description: Determines if node reboot is enabled
          clientIp:
            type: string
          allowedIps:
            type: array
            description: List of CIDR formatted rules a.b.c.d/e
            items:
              $ref: '#/components/schemas/FirewallRule'
          dataCenters:
            type: array
            items:
              $ref: '#/components/schemas/ClusterDCInfoEnriched'
          nodes:
            type: array
            items:
              $ref: '#/components/schemas/NodeInfoEnriched'
          vpcList:
            type: array
            items:
              $ref: '#/components/schemas/ClusterNetwork'
          vpcPeeringList:
            type: array
            items:
              $ref: '#/components/schemas/ClusterVPCPeeringInfo'
          connections:
            type: array
            items:
              $ref: '#/components/schemas/ClusterConnection'
    EncryptionAtRest:
      type: object
      x-public: true
      properties:
        keyId:
          type: string
          description: 'Provide the ID of the customer-managed key created in the
            ScyllaDB Cloud portal.

            Omit this item to allow ScyllaDB Cloud to automatically create a service-managed
            key.'
          example: key-deadbeef
        provider:
          type: string
          description: key provider, customer managed or scylla managed
          enum:
          - scylla-aws
          - scylla-gcp
          - aws
          - gcp
          example: scylla-aws
    VectorSearch:
      type: object
      x-public: true
      properties:
        nodeCount:
          description: Number of vector search nodes to create in the datacenter,
            nodes are distributed evenly across cluster racks
          type: integer
          example: 2
          minimum: 1
          maximum: 27
        defaultInstanceTypeId:
          type: integer
          description: ID of the instance type to use for vector search nodes (instance
            type list [get] /deployment/cloud-provider/{}/region/{}?target=VECTOR_SEARCH)
    ClusterDCInfo:
      type: object
      x-public: true
      properties:
        id:
          type: integer
          description: ID of the datacenter
        clusterId:
          type: integer
          description: ID of the cluster where the datacenter belongs to
        cloudProviderId:
          type: integer
          description: ID of the cloud provider (full list [get] /deployment/cloud-providers)
        regionId:
          type: integer
          description: ID of the cloud provider region (full list [get] /deployment/cloud-provider/{}/regions)
        replicationFactor:
          type: integer
          description: Replication Factor (RF)
        cidrBlock:
          $ref: '#/components/schemas/CIDR'
        accountCloudProviderCredentialsId:
          type: integer
          description: ID of the account credentials
        status:
          type: string
