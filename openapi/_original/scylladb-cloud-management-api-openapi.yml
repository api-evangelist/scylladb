        provisioning:
          default: dedicated-vm
          enum:
          - dedicated-vm
          type: string
        requestBody:
          description: JSON body of the request
          type: string
        requestType:
          description: Defines the type of the request
          enum:
          - RESIZE_CLUSTER_V2
