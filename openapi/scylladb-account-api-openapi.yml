servers:
- url: /
security:
- Authorization: []
tags:
- name: Account
paths:
  /account/{accountId}/cloud-account:
    get:
      operationId: getCloudAccount
      description: Returns list of active cloud-accounts for all cloud-providers from given account
      summary: Get the list of active cloud-accounts
      x-public: true
      tags:
      - Account
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudAccount'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/cloud-account/{cloudAccountId}/region/{regionId}/zones:
    get:
      operationId: getCloudAccountZones
      description: Returns list of availability zones for a specific cloud account and region
      summary: Get availability zones for a cloud account and region
      x-public: true
      tags:
      - Account
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - description: CloudAccountId
        in: path
        name: cloudAccountId
        required: true
        schema:
          type: string
      - description: RegionId
        in: path
        name: regionId
        required: true
        schema:
          type: string
      - description: Instance Type ID to filter available zones
        in: query
        name: instanceTypeId
        required: false
        schema:
          type: string
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the availability zone
                          example: use1-az2
                        name:
                          type: string
                          description: Name of the availability zone
                          example: us-east-1a
  /account/{accountId}/cluster/{clusterId}/notifications/email:
    post:
      operationId: setClusterNotificationEmail
      summary: Set cluster notification emails
      description: Set the contact email address(es) used for cluster notifications
      x-public: true
      tags:
      - Account
      parameters:
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - emails
              properties:
                emails:
                  items:
                    type: string
                  type: array
                  example:
                  - notifications@achme.com
                  - other@mail.com
      security:
      - Authorization: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    $ref: '#/components/schemas/NotificationEmail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: integer
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
  /account/default:
    get:
      operationId: getAccount
      description: Gives account details tied to authorized user.
      x-public: true
      summary: Gives account details tied to authorized user
      tags:
      - Account
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/notifications/email:
    get:
      operationId: getNotificationsEmail
      summary: Get cluster notification emails
      description: Get the contact email address(es) used for cluster notifications
      x-public: true
      tags:
      - Account
      parameters:
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    $ref: '#/components/schemas/NotificationEmail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
    post:
      operationId: setNotificationEmail
      summary: Set cluster notification emails
      description: Set the contact email address(es) used for cluster notifications
      x-public: true
      tags:
