openapi: 3.2.0
info:
  title: ScyllaDB Cloud Cluster API
  version: 1.0.0
  description: '### Error codes mapping

    000001 Too many requests sent from your IP address.'
servers:
- url: /
security:
- Authorization: []
tags:
- name: Cluster
paths:
  /account/{accountId}/clusters:
    get:
      operationId: getClusters
      summary: Get the list of all clusters belonging to given account
      description: Returns list of all clusters belonging to given account.
      x-public: true
      tags:
      - Cluster
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: query
        description: Enrich cluster with additional data (provider, region, instance)
        name: enriched
        required: false
        schema:
          type: boolean
      - in: query
        description: Get cluster with metrics data - list of comma separated metrics to fetch
        name: metrics
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MetricName'
        style: form
        explode: false
        example:
        - NODES_UP
        - STORAGE_FREE
        - STORAGE_USED
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    properties:
                      clusters:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/ClusterInfo'
                          - $ref: '#/components/schemas/ClusterEnriched'
                          - $ref: '#/components/schemas/ClusterWithMetrics'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/cluster/{clusterId}/delete:
    post:
      operationId: deleteCluster
      x-public: true
      summary: Delete cluster (async)
      tags:
      - Cluster
      parameters:
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      - in: header
        name: traceparent
        schema:
          type: string
      requestBody:
        description: name of the cluster
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clusterName:
                  type: string
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    $ref: '#/components/schemas/ClusterRequest'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/cluster/{clusterId}/resize:
    post:
      operationId: resizeCluster
      description: create cluster resize request (async)
      x-public: true
      summary: Resize cluster (async)
      tags:
      - Cluster
      parameters:
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      - in: header
        name: traceparent
        schema:
          type: string
      requestBody:
        description: cluster-resize request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterResizeRequest'
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    $ref: '#/components/schemas/ClusterResizeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/cluster/{clusterId}/dc/{dcId}/scaling:
    put:
      operationId: updateDcScalingPolicy
      summary: Update datacenter scaling policy
      description: Updates the scaling policy configuration for a specific datacenter including instance types, families, and scaling policies
      x-public: true
      tags:
      - Cluster
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      - name: dcId
        in: path
        description: ID of the datacenter
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceTypeIDs:
                  type: array
                  items:
                    type: integer
                instanceFamilies:
                  type: array
                  items:
                    type: string
                policies:
                  $ref: '#/components/schemas/APIDCScalingPolicies'
      security:
      - Authorization: []
      responses:
        '200':
          description: OK - Scaling policy updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterRequest'
                  error:
                    type: string
  /account/{accountId}/cluster:
    post:
      operationId: createCluster
      description: Create a cluster-create request (async).
      x-public: true
      summary: Create cluster-create request (async)
      tags:
      - Cluster
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      requestBody:
        description: cluster-create request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequestV1'
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    properties:
                      requestId:
                        type: string
                      fields:
                        $ref: '#/components/schemas/ClusterCreateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/cluster/{clusterId}:
    get:
      operationId: getClusterDetails
      summary: Get cluster details
      description: Get full details of a specific cluster.
      x-public: true
      tags:
      - Cluster
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      - in: query
        description: Enrich cluster with additional data
        name: enriched
        required: false
        schema:
          type: boolean
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    properties:
                      cluster:
                        $ref: '#/components/schemas/ClusterDetailedInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
  /account/{accountId}/cluster/{clusterId}/nodes:
    get:
      operationId: getClusterNodes
      summary: Get cluster nodes
      description: Get the list of cluster nodes.
      x-public: true
      tags:
      - Cluster
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      - in: query
        description: Enrich nodes with additional data
        name: enriched
        required: false
        schema:
          type: boolean
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    properties:
                      nodes:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeInfoEnriched'
  /account/{accountId}/cluster/{clusterId}/dcs:
    get:
      operationId: getClusterDCs
      summary: Get cluster data centers
      description: Get the list of data centers used by a cluster.
      x-public: true
      tags:
      - Cluster
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      - in: query
        description: Enrich DCs with additional data
        name: enriched
        required: false
        schema:
          type: boolean
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    properties:
                      dataCenters:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClusterDCInfoEnriched'
  /account/{accountId}/cluster/{clusterId}/name:
    patch:
      operationId: updateClusterName
      summary: Update cluster name (async)
      x-public: true
      description: Update cluster name.
      parameters:
      - in: header
        name: traceparent
        schema:
          type: string
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      requestBody:
        description: new cluster name
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      security:
      - Authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterRequest'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: integer
        '500':
          description: Internal Server Error
      tags:
      - Cluster
  /account/{accountId}/cluster/{clusterId}/notifications/email:
    post:
      operationId: setClusterNotificationEmail
      summary: Set cluster notification emails
      description: Set the contact email address(es) used for cluster notifications
      x-public: true
      tags:
      - Cluster
      parameters:
      - in: path
        description: Account ID
        name: accountId
        required: true
        schema:
          type: integer
      - in: path
        description: Cluster ID
        name: clusterId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - emails
              properties:
                emails:
                  items:
                    type: string
                  type: array
                  example:
                  - notifications@achme.com
                  - other@mail.com
      security:
      - Authorization: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  data:
                    $ref: '#/components/schemas/NotificationEmail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: integer
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
components:
  schemas:
    ClusterConnection:
      type: object
      description: Peering details information
      x-public: true
      properties:
        awaitingData:
          allOf:
          - type: object
          - $ref: '#/components/schemas/ClusterConnectionAwaitingData'
          description: AwaitingData represents information regarding the action that needs to be done to move connection creating process further
        awaitingForClient:
          type: boolean
          description: AwaitingForClient if true, then going to next stage require user action
        cidrlist:
          type: array
          description: CIDR list of the routes cluster have access through this connection
          items:
            $ref: '#/components/schemas/CIDR'
        clusterDCID:
          type: integer
          description: ID of the cluster DC
        clusterID:
          type: integer
          description: ID of the cluster
        clusterVPCID:
          type: integer
          description: ID of the VPC
        data:
          type: object
          additionalProperties:
            type: string
        externalID:
          type: string
          description: ExternalID and ID of the connection object on the cloud
        id:
          type: integer
          description: ID of the created connection (ScyllaDB internal)
        name:
          type: string
          description: Name if the connection, only to show on UI
        stage:
          type: string
          description: Stage if there is ongoing process it shows where this process exactly at
        stageMessage:
          type: string
          description: StageMessage is a message from stage processor why it can't move further
        status:
          type: string
          enum:
          - INIT
          - PENDING
          - ACTIVE
          - INACTIVE
          - DELETING
          - DELETED
          - FAILED
        type:
          type: string
          enum:
          - AWS_TGW_ATTACHMENT
    NotificationEmail:
      x-public: true
      type: object
      properties:
        email:
          description: 'Deprecated: Emails should be used instead.'
          type: string
          deprecated: true
        emails:
          type: array
          items:
            type: string
        clusterNotifications:
          type: array
          items:
            $ref: '#/components/schemas/ClusterNotification'
    ClusterNotification:
      x-public: true
      type: object
      properties:
        clusterId:
          description: ID of the cluster
          type: integer
        clusterName:
          description: Name of the cluster
          type: string
        emails:
          type: array
          items:
            type: string
    ClusterResizeDCNodes:
      type: object
      x-public: true
      properties:
        dcId:
          type: integer
          description: DCID is the cluster DC ID for which the changes are requested
        instanceTypeId:
          type: integer
          description: 'InstanceTypeID refers to what instance type should now be used for the DC.

            Please see implementation details to know if this change is done automatically for by support.'
        wantedSize:
          type: integer
          description: 'WantedSize is the new size for scaling, can be greater or smaller than the current size

            Needs to account for RF (cluster replication factor)

            Validation will reject it unless size%RF == 0'
      required:
      - dcId
      - wantedSize
    EncryptionAtRest:
      type: object
      x-public: true
      properties:
        keyId:
          type: string
          description: 'Provide the ID of the customer-managed key created in the ScyllaDB Cloud portal.

            Omit this item to allow ScyllaDB Cloud to automatically create a service-managed key.'
          example: key-deadbeef
        provider:
          type: string
          description: key provider, customer managed or scylla managed
          enum:
          - scylla-aws
          - scylla-gcp
          - aws
          - gcp
          example: scylla-aws
    FirewallRule:
      x-public: true
      properties:
        clusterId:
          type: integer
          description: ID of the cluster
        id:
          type: integer
          description: ID of the firewall allowed rule
        address:
          type: string
          description: CIDR notation
          example: 192.0.2.0/24
      type: object
    ClusterResizeRequest:
      type: object
      x-public: true
      properties:
        dcNodes:
          type: array
          description: Mapping for the requested changes for each DC
          items:
            $ref: '#/components/schemas/ClusterResizeDCNodes'
    scyllaVersion:
      type: object
      description: Represent version of the ScyllaDB installed on nodes
      x-public: true
      properties:
        id:
          type: integer
          description: ID of the service version
          example: 103
        version:
          type: string
          description: Name of the service version
          example: 2021.1.16
        description:
          type: string
          description: Version description
          example: Scylla Enterprise 2021.1.16
        newCluster:
          type: string
          description: Describes if this version should be available for creating new clusters using the frontend wizard
          example: DISABLED
          enum:
          - ENABLED
          - DISABLED
        serviceId:
          type: integer
          description: ID of the service
          example: 1
        name:
          type: string
          description: Version name
          example: Scylla Enterprise
    NodeInfoEnriched:
      x-public: true
      allOf:
      - $ref: '#/components/schemas/NodeInfo'
      - type: object
        properties:
          cloudProvider:
            $ref: '#/components/schemas/cloudProvider'
          region:
            $ref: '#/components/schemas/region'
          instance:
            $ref: '#/components/schemas/instance'
          dataCenter:
            $ref: '#/components/schemas/ClusterDCInfo'
    ClusterRequestProgress:
      type: object
      x-public: true
      properties:
        progressPercent:
          type: integer
          description: Request processing progress
        progressDescription:
          type: string
          description: Request progress description
    ClusterNetwork:
      type: object
      x-public: true
      properties:
        clusterId:
          type: integer
          description: ID of the cluster where the datacenter belongs to
        id:
          type: integer
          description: ID of the VPC (internal for scylla-cloud)
        cloudProviderId:
          type: integer
          description: ID of the cloud provider (full list [get] /deployment/cloud-providers)
        regionId:
          type: integer
          description: ID of the cloud provider region (full list [get] /deployment/cloud-provider/{}/regions)
        cidrBlock:
          $ref: '#/components/schemas/CIDR'
    instance:
      type: object
      description: Cloud provider instance pricing description
      x-public: true
      properties:
        id:
          type: integer
          description: ID of the instance type (internal for scylla-cloud)
          example: 40
        externalId:
          type: string
          description: External ID of the cloud provider instance type
          example: n2-highmem-2
        cloudProviderId:
          type: integer
          description: ID of the cloud provider (full list [get] /deployment/cloud-providers)
          example: 2
        groupDefault:
          type: boolean
          description: GroupDefault says which one is the default in a group of matching external_id
        displayOrder:
          type: integer
          description: Position when showing multiple instance types
          example: 3
        memory:
          type: integer
          description: Instance type RAM size in Megabytes
          example: 16384
        localDiskCount:
          type: integer
          description: Instance type disk count
          example: 1
        totalStorage:
          type: integer
          description: Instance type total storage size (uses base of 10 GB)
          example: 375
        cpuCount:
          type: integer
          description: Instance type CPU core count
          example: 2
        networkSpeed:
          type: integer
          description: Instance type network bandwidth in Megabytes per second
          example: 10
        networkSpeedDescription:
          description: Network performance description
          example: Maximum egress bandwidth, 10 Gbps
          type: string
        baseNetworkSpeed:
          description: The network performance in Megabytes per second
          example: 5
          type: integer
        externalStorageNetworkSpeed:
          type: integer
          description: Cloud provider storage bandwidth in Megabytes per second
          example: 0
        costPerHour:
          type: number
          description: Deprecated in favor of InstanceCostHourly
          deprecated: true
        environment:
          type: string
          description: Development clusters lack advanced features (e.g. Scylla Manager, monitoring alerts and many others) which are present in Production clusters
          enum:
          - PRODUCTION
          - DEVELOPMENT
        licenseCostOnDemandPerHour:
          type: number
          description: Deprecated in favor of SubscriptionCostHourly
          deprecated: true
        subscriptionCostHourly:
          type: number
          description: Scylla related part of the cost per hour
          example: 0.0956
        subscriptionCostHourlyXCloud:
          type: number
          description: Scylla related part of the cost per hour for XCloud
          example: 0.12
        subscriptionCostHourlyXCloudBYOA:
          type: number
          description: Scylla related part of the cost per hour for XCloud BYOA
          example: 0.15
        subscriptionCostMonthly:
          type: number
          description: Scylla related part of the cost per month
          example: 54
        subscriptionCostMonthlyXCloud:
          type: number
          description: Scylla related part of the cost per month for XCloud
          example: 65
        subscriptionCostYearly:
          type: number
          description: Scylla related part of the cost per year
          example: 560
        subscriptionCostYearlyXCloud:
          type: number
          description: Scylla related part of the cost per year for XCloud
          example: 650
        instanceCostHourly:
          type: number
          description: Cloud provider related part of the cost
          example: 0.03
        instanceFamily:
          description: Describes instance type best price-performance workloads
          example: n2
          type: string
        freeTier:
          description: This instance type can be used on a free tier cluster
          type: boolean
    VectorSearch:
      type: object
      x-public: true
      properties:
        nodeCount:
          description: Number of vector search nodes to create in the datacenter, nodes are distributed evenly across cluster racks
          type: integer
          example: 2
          minimum: 1
          maximum: 27
        defaultInstanceTypeId:
          type: integer
          description: ID of the instance type to use for vector search nodes (instance type list [get] /deployment/cloud-provider/{}/region/{}?target=VECTOR_SEARCH)
    ClusterDCInfoEnriched:
      x-public: true
      allOf:
      - $ref: '#/components/schemas/ClusterDCInfo'
      - type: object
        properties:
          cloudProvider:
            $ref: '#/components/schemas/cloudProvider'
          region:
            $ref: '#/components/schemas/region'
    APIDCScalingPolicyVCPU:
      type: object
      x-public: true
      properties:
        min:
          type: integer
          description: Minimum number of vCPUs
    ClusterEnriched:
      x-public: true
      allOf:
      - $ref: '#/components/schemas/ClusterInfo'
      - type: object
        properties:
          scyllaVersion:
            $ref: '#/components/schemas/scyllaVersion'
          cloudProvider:
            $ref: '#/components/schemas/cloudProvider'
          regionId:
            type: integer
            description: ID of the cloud provider region (full list [get] /deployment/cloud-provider/{}/regions)
          region:
            $ref: '#/components/schemas/region'
          instanceId:
            type: integer
            description: ID of the instance type
          instance:
            $ref: '#/components/schemas/instance'
    ClusterConnectionAwaitingData:
      type: object
      x-public: true
      additionalProperties:
        type: string
    cloudProvider:
      type: object
      description: Cloud provider description
      x-public: true
      properties:
        id:
          type: integer
          description: ID of the cloud provider (internal for scylla-cloud)
          example: 1
        name:
          type: string
          description: Name of the cloud provider
          example: AWS
        rootAccountId:
          type: string
          description: Cloud provider account ID
          example: '123456789012'
    ProvisionType:
      type: string
      enum:
      - dedicated-vm
      default: dedicated-vm
      x-public: true
      description: type of the cluster provisioning
    APIDCScalingPolicies:
      type: object
      x-public: true
      properties:
        storage:
          $ref: '#/components/schemas/APIDCScalingPolicyStorage'
        vcpu:
          $ref: '#/components/schemas/APIDCScalingPolicyVCPU'
    ClusterRequest:
      type: object
      x-public: true
      properties:
        accountId:
          type: integer
          description: ID of the account where cluster belongs to
        clusterId:
          type: integer
          description: ID of the cluster where the datacenter belongs to
        connectionID:
          type: integer
        id:
          type: integer
          description: ID of the cluster request
        progressDescription:
          type: string
          description: Request progress description
        progressPercent:
          type: integer
          description: Request processing progress
        requestBody:
          type: string
          description: JSON body of the request
        requestType:
          type: string
          description: Defines type of the request
          enum:
          - ADD_DC
          - CREATE_CLUSTER
          - DELETE_CLUSTER
          - RESIZE_CLUSTER_V2
          - RESIZE_CLUSTER_V3
          - UPGRADE_CLUSTER
          - SCALE_CLUSTER
          - INSTALL_MANAGER
          - DNS
          - CREATE_VPC_PEERING
          - DELETE_VPC_PEERING
