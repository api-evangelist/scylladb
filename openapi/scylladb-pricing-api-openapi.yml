openapi: 3.2.0
info:
  title: ScyllaDB Cloud Pricing API
  version: 1.0.0
  description: '### Error codes mapping

    000001 Too many requests sent from your IP address.'
servers:
- url: /
security:
- Authorization: []
tags:
- name: Pricing
paths:
  /pricing:
    post:
      operationId: searchPricing
      summary: Search pricing
      description: Searches for pricing items based on infrastructure, product, and commercial filters
      x-public: true
      tags:
      - Pricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - infrastructure
              properties:
                infrastructure:
                  type: object
                  required:
                  - provider
                  properties:
                    provider:
                      type: string
                      example: AWS
                    region:
                      type: string
                      description: Resolves region by code (e.g. "us-east-1") or display name (e.g. "Virginia")
                      example: us-east-1
                    deployment:
                      type: string
                      enum:
                      - Cloud
                      - BYOA
                    instanceFamily:
                      type: string
                      example: i4i
                    instanceType:
                      type: string
                      example: i4i.large
                product:
                  type: object
                  properties:
                    productTypes:
                      type: array
                      items:
                        type: string
                        enum:
                        - STANDARD_CLOUD
                        - XCLOUD
                        - VECTOR_SEARCH
                commercial:
                  type: object
                  properties:
                    contractType:
                      type: string
                      enum:
                      - ON_DEMAND
                      - SUBSCRIPTION
                      - FLEX_CREDIT
                    contractTerm:
                      type: string
                      enum:
                      - 1_YEAR
                      - 3_YEARS
                      - ANY
                    paymentOption:
                      type: string
                      enum:
                      - UPFRONT
                      - MONTHLY
                      - CONSUMPTION
                      - ANY
                    subscriptionTier:
                      type: string
                      enum:
                      - STANDARD
                      - PRO
                      - PREMIUM
                      - ANY
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                      format: int64
                      minimum: 1
                    limit:
                      type: integer
                      format: int64
                      minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        skuId:
                          type: string
                          description: Unique ID for Cart/Billing
                        infrastructure:
                          type: object
                          properties:
                            provider:
                              type: string
                            region:
                              type: string
                            instanceType:
                              type: string
                            vcpu:
                              type: integer
                            storageTb:
                              type: number
                              format: double
                            instanceFamily:
                              type: string
                            deployment:
                              type: string
                              enum:
                              - Cloud
                              - BYOA
                        product:
                          type: object
                          properties:
                            productType:
                              type: string
                              enum:
                              - STANDARD_CLOUD
                              - XCLOUD
                              - VECTOR_SEARCH
                        commercial:
                          type: object
                          properties:
                            contractType:
                              type: string
                              enum:
                              - ON_DEMAND
                              - SUBSCRIPTION
                              - FLEX_CREDIT
                            contractTerm:
                              type: string
                              enum:
                              - 1_YEAR
                              - 3_YEARS
                              - ANY
                            paymentOption:
                              type: string
                              enum:
                              - UPFRONT
                              - MONTHLY
                              - CONSUMPTION
                              - ANY
                            subscriptionTier:
                              type: string
                              enum:
                              - STANDARD
                              - PRO
                              - PREMIUM
                              - ANY
                        pricing:
                          type: object
                          properties:
                            currencyCode:
                              type: string
                            estimates:
                              type: array
                              items:
                                type: object
                                properties:
                                  intervalCode:
                                    type: string
                                    description: ISO 8601 duration, e.g. "PT1H", "P1M", "P3Y"
                                  displayLabel:
                                    type: string
                                    description: e.g. "Hourly", "3 Year Total"
                                  totalAmount:
                                    type: number
                                    format: double
                                  softwareAmount:
                                    type: number
                                    format: double
                                  hardwareAmount:
                                    type: number
                                    format: double
                                  vcpuSoftwareAmount:
                                    type: number
                                    format: double
                                  storageSoftwareAmount:
                                    type: number
                                    format: double
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
components:
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      description: 'Authorization header, required in all authenticated requests.


        Header format: **Authorization: Bearer <token>**

        '
